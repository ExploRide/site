<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExploRide – Facebook</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .wrap {
      text-align: center;
      padding: 24px;
      max-width: 360px;
      width: 100%;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 20px;
      background: #1877F2;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(24,119,242,.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:active {
      transform: scale(.97);
      box-shadow: 0 5px 15px rgba(24,119,242,.4);
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      opacity: .7;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="logo">ExploRide</div>

    <a class="btn"
       href="fb://facewebmodal/f?href=https://www.facebook.com/ExploRideURBEX/posts/pfbid037fXAEzJqbQKvhk6tW6QaLN7rFu6NXzY2Arw4eyxtJuySxAW6J6ZQf7hES9K8SbFBl">
      Otwórz w aplikacji
    </a>

    <div class="hint">
      Jeśli aplikacja nie otworzy się automatycznie,<br>
      upewnij się, że Facebook jest zainstalowany.
    </div>
  </div>

</body>
</html>

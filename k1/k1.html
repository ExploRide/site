<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .wrap {
      width: 100%;
      max-width: 420px;      /* 👈 kontrola szerokości */
      padding: 0 24px;       /* 👈 luz po bokach */
      text-align: center;
    }

    .btn {
      display: block;
      padding: 18px 24px;
      background: #1877F2;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(24,119,242,.45);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 18px rgba(24,119,242,.45);
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <a class="btn"
       href="fb://facewebmodal/f?href=https://www.facebook.com/ExploRideURBEX/posts/pfbid037fXAEzJqbQKvhk6tW6QaLN7rFu6NXzY2Arw4eyxtJuySxAW6J6ZQf7hES9K8SbFBl">
      Otwórz w aplikacji Facebook
    </a>

    <div class="hint">
      Jeśli aplikacja nie otworzy się automatycznie,<br>
      upewnij się, że Facebook jest zainstalowany.
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Otwieranie YouTube…</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000;
      color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      padding:24px;
      text-align:center;
    }
    .msg{
      opacity:.8;
      font-size:16px;
      line-height:1.4;
      max-width:420px;
    }
  </style>

  <script>
    const ytWeb = "https://www.youtube.com/playlist?list=PL8VD37UX-sp307h8_THjJLzS7QWKjm8Yi";
    const ytApp = "vnd.youtube://playlist?list=PL8VD37UX-sp307h8_THjJLzS7QWKjm8Yi";

    // Fallback – jeśli apka się nie otworzy, przejdź do web
    const fallbackTimer = setTimeout(() => {
      window.location.replace(ytWeb);
    }, 1200);

    // Próba odpalenia aplikacji YouTube
    window.location.href = ytApp;

    // Jeśli apka się otworzy i strona zniknie – czyścimy fallback
    window.addEventListener("pagehide", () => clearTimeout(fallbackTimer));
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearTimeout(fallbackTimer);
    });
  </script>
</head>
<body>
  <div class="msg">
    Otwieram playlistę w aplikacji YouTube…<br>
    Jeśli nic się nie stanie, za chwilę otworzę wersję w przeglądarce.
  </div>
</body>
</html>
